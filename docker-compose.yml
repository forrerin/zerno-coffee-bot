name: zerno

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zerno}:${POSTGRES_PASSWORD:-zerno}@db:5432/${POSTGRES_DB:-zerno}
    REDIS_URL: redis://redis:6379/0
    MEDIA_DIR: /app/media
  volumes:
    - media:/app/media
    - logs:/app/logs
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zerno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zerno}
      POSTGRES_DB: ${POSTGRES_DB:-zerno}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zerno} -d ${POSTGRES_DB:-zerno}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    <<: *backend
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      api: { condition: service_healthy }  # API создаёт таблицы и наполняет меню

  nginx:
    build:
      context: ./webapp
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # продление сертификата раз в 12 часов (certbot сам решает, пора ли)
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-zerno}
    volumes:
      - ./backups:/backups
    depends_on:
      db: { condition: service_healthy }
    # ежедневный дамп БД, храним последние 7
    entrypoint:
      - /bin/sh
      - -c
      - |
        while :; do
          pg_dump -h db -U ${POSTGRES_USER:-zerno} ${POSTGRES_DB:-zerno} | gzip > /backups/zerno-$$(date +%F).sql.gz
          find /backups -name 'zerno-*.sql.gz' -mtime +7 -delete
          sleep 86400
        done
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
  logs:
