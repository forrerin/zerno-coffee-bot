# Сборка Mini App и публикация на GitHub Pages (бесплатный быстрый хостинг статики).
# API при этом работает отдельно — адрес передаётся ботом параметром ?api=
name: Mini App → GitHub Pages

on:
  push:
    branches: [main]
    paths: ["webapp/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Build
        working-directory: webapp
        env:
          # gist с актуальным адресом API (сервер обновляет его при каждом запуске)
          VITE_API_GIST: ${{ vars.API_GIST_ID }}
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist
      - id: deployment
        uses: actions/deploy-pages@v4
